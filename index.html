<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Countdown — Study Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F3EC;
    --ink:#1D2B33;
    --ink-soft:#6B7A80;
    --rule:#D8D2C2;
    --amber:#C9822C;
    --amber-dim:rgba(201,130,44,.14);
    --done:#4F7A63;
    --danger:#B4523E;
    --card:#FFFFFF;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: var(--paper);
    color: var(--ink);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    background-image:
      repeating-linear-gradient(to bottom, transparent 0 38px, var(--rule) 38px 39px);
  }
  header{ padding: 34px 24px 20px; max-width: 1080px; margin:0 auto; }
  .eyebrow{ font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color: var(--amber); }
  h1{ font-family:'Fraunces', serif; font-weight:700; font-size: 42px; letter-spacing:-0.01em; margin-top:4px; }
  h1 span{ color: var(--amber); }
  .lede{ color: var(--ink-soft); font-size:14px; margin-top:6px; max-width:520px; }

  main{ max-width: 1080px; margin:0 auto; padding: 10px 24px 80px; }

  .today-strip{
    display:flex; gap:16px; overflow-x:auto; padding: 4px 0 22px;
    margin-bottom: 20px; border-bottom: 1px dashed var(--rule);
  }
  .ticket{
    background: var(--card); border: 1px solid var(--rule); border-radius: 10px;
    padding: 14px 18px; min-width: 190px; flex-shrink:0;
    position:relative;
  }
  .ticket::before, .ticket::after{
    content:''; position:absolute; width:14px; height:14px; background: var(--paper);
    border-radius:50%; top:50%; transform: translateY(-50%);
  }
  .ticket::before{ left:-7px; } .ticket::after{ right:-7px; }
  .ticket .days{ font-family:'Fraunces', serif; font-size: 30px; font-weight:700; color: var(--amber); line-height:1; }
  .ticket .lbl{ font-family:'IBM Plex Mono', monospace; font-size:10px; text-transform:uppercase; letter-spacing:.06em; color: var(--ink-soft); margin-top:6px; }
  .ticket .sub{ font-size:13px; font-weight:600; margin-top:2px; }
  .ticket.urgent .days{ color: var(--danger); }
  .empty-ticket{ font-family:'IBM Plex Mono', monospace; font-size:12px; color: var(--ink-soft); padding: 20px 0; }

  .section-head{ display:flex; align-items:baseline; gap:12px; margin: 34px 0 16px; }
  .section-head .num{ font-family:'IBM Plex Mono', monospace; color: var(--amber); font-size:13px; }
  .section-head h2{ font-family:'Fraunces', serif; font-weight:600; font-size:22px; }
  .section-head .hint{ margin-left:auto; font-family:'IBM Plex Mono', monospace; font-size:11px; color: var(--ink-soft); }

  .focus-list{ display:flex; flex-direction:column; gap:8px; }
  .focus-item{
    background: var(--card); border:1px solid var(--rule); border-radius:8px;
    padding:12px 16px; display:flex; align-items:center; gap:12px; font-size:14px;
  }
  .focus-item .dot{ width:8px; height:8px; border-radius:50%; background: var(--amber); flex-shrink:0; }
  .focus-item b{ color: var(--ink-soft); font-weight:500; margin-left:auto; font-family:'IBM Plex Mono', monospace; font-size:12px; }

  .add-form{
    background: var(--card); border:1px solid var(--rule); border-radius: 12px; padding:20px; margin-bottom:20px;
  }
  .row{ display:grid; grid-template-columns: 2fr 1fr 1fr auto; gap:10px; align-items:end; }
  label{ display:block; font-family:'IBM Plex Mono', monospace; font-size:10px; text-transform:uppercase; letter-spacing:.08em; color: var(--ink-soft); margin-bottom:6px; }
  input{
    width:100%; padding:10px 12px; border-radius:7px; border:1px solid var(--rule);
    background: var(--paper); font-family:'Inter', sans-serif; font-size:14px; color: var(--ink);
  }
  input:focus{ outline:2px solid var(--amber); outline-offset:1px; }
  .btn{
    font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:.06em; text-transform:uppercase;
    background: var(--ink); color: var(--paper); border:none; padding: 11px 18px; border-radius:7px; cursor:pointer;
    white-space:nowrap;
  }
  .btn:hover{ background: var(--amber); }
  .btn.small{ padding:6px 12px; font-size:10px; }
  .btn.ghost{ background:transparent; color:var(--ink); border:1px solid var(--rule); }
  .btn.ghost:hover{ background: var(--rule); }

  .subject-card{
    background: var(--card); border:1px solid var(--rule); border-radius:12px; padding:20px; margin-bottom:14px;
  }
  .subject-top{ display:flex; align-items:center; gap:14px; margin-bottom:10px; }
  .subject-top h3{ font-family:'Fraunces', serif; font-size:19px; font-weight:600; }
  .subject-top .exam-date{ font-family:'IBM Plex Mono', monospace; font-size:11px; color: var(--ink-soft); }
  .subject-top .days-left{ margin-left:auto; font-family:'IBM Plex Mono', monospace; font-size:12px; padding:5px 10px; border-radius:20px; background: var(--amber-dim); color: var(--amber); }
  .days-left.urgent{ background: rgba(180,82,62,.14); color: var(--danger); }
  .progress-track{ height:8px; background: var(--rule); border-radius:4px; overflow:hidden; margin-bottom:14px; }
  .progress-fill{ height:100%; background: var(--done); border-radius:4px; transition: width .3s; }

  .topic-add{ display:flex; gap:8px; margin-bottom:12px; }
  .topic-add input{ flex:1; }
  .topic-list{ display:flex; flex-direction:column; gap:6px; }
  .topic-row{ display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:6px; background: var(--paper); }
  .topic-row.done .t-name{ text-decoration: line-through; color: var(--ink-soft); }
  .topic-row input[type=checkbox]{ width:16px; height:16px; accent-color: var(--done); }
  .t-name{ flex:1; font-size:14px; }
  .del-x{ background:none; border:none; color: var(--ink-soft); cursor:pointer; font-size:15px; }
  .del-x:hover{ color: var(--danger); }
  .no-topics{ font-family:'IBM Plex Mono', monospace; font-size:12px; color: var(--ink-soft); padding: 6px 2px; }
  .subject-actions{ text-align:right; margin-top:10px; }

  .empty-state{ font-family:'IBM Plex Mono', monospace; font-size:13px; color: var(--ink-soft); padding: 30px; text-align:center; border:1px dashed var(--rule); border-radius:10px; }

  footer{ text-align:center; padding:30px 24px; font-family:'IBM Plex Mono', monospace; font-size:11px; color: var(--ink-soft); }

  @media (max-width:700px){
    .row{ grid-template-columns: 1fr 1fr; }
    .row .btn{ grid-column: span 2; }
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">Study Planner</div>
  <h1>Countdown<span>.</span></h1>
  <p class="lede">Track syllabus progress subject by subject, and let the countdown tell you how much to study today.</p>
</header>

<main>

  <div class="today-strip" id="today-strip"></div>

  <div class="section-head">
    <span class="num">◆</span>
    <h2>Today's focus</h2>
    <span class="hint" id="focus-hint"></span>
  </div>
  <div class="focus-list" id="focus-list"></div>

  <div class="section-head">
    <span class="num">◆</span>
    <h2>Add subject</h2>
  </div>
  <div class="add-form">
    <div class="row">
      <div>
        <label>Subject name</label>
        <input type="text" id="new-subject" placeholder="Operating Systems">
      </div>
      <div>
        <label>Exam date</label>
        <input type="date" id="new-exam-date">
      </div>
      <div>
        <label>Topics (comma separated)</label>
        <input type="text" id="new-topics" placeholder="Deadlock, Paging, Scheduling">
      </div>
      <button class="btn" onclick="addSubject()">Add subject</button>
    </div>
  </div>

  <div class="section-head">
    <span class="num">◆</span>
    <h2>Subjects</h2>
  </div>
  <div id="subjects-container"></div>

</main>

<footer>Countdown — local-only planner. Data stored in your browser via localStorage.</footer>

<script>
  const load = (k,d) => JSON.parse(localStorage.getItem(k) || JSON.stringify(d));
  const save = (k,v) => localStorage.setItem(k, JSON.stringify(v));
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

  function daysUntil(dateStr){
    const today = new Date(); today.setHours(0,0,0,0);
    const exam = new Date(dateStr); exam.setHours(0,0,0,0);
    return Math.round((exam - today) / 86400000);
  }

  function getSubjects(){ return load('planner_subjects', []); }
  function setSubjects(s){ save('planner_subjects', s); }

  function addSubject(){
    const name = document.getElementById('new-subject').value.trim();
    const examDate = document.getElementById('new-exam-date').value;
    const topicsRaw = document.getElementById('new-topics').value.trim();
    if(!name || !examDate){ alert('Please enter subject name and exam date.'); return; }
    const topics = topicsRaw
      ? topicsRaw.split(',').map(t => t.trim()).filter(Boolean).map(t => ({ id: uid(), name: t, done: false }))
      : [];
    const subjects = getSubjects();
    subjects.push({ id: uid(), name, examDate, topics });
    setSubjects(subjects);
    document.getElementById('new-subject').value = '';
    document.getElementById('new-exam-date').value = '';
    document.getElementById('new-topics').value = '';
    renderAll();
  }

  function deleteSubject(id){
    if(!confirm('Delete this subject and all its topics?')) return;
    setSubjects(getSubjects().filter(s => s.id !== id));
    renderAll();
  }

  function addTopic(subjectId, inputEl){
    const val = inputEl.value.trim();
    if(!val) return;
    const subjects = getSubjects();
    const s = subjects.find(s => s.id === subjectId);
    s.topics.push({ id: uid(), name: val, done: false });
    setSubjects(subjects);
    inputEl.value = '';
    renderAll();
  }

  function toggleTopic(subjectId, topicId){
    const subjects = getSubjects();
    const s = subjects.find(s => s.id === subjectId);
    const t = s.topics.find(t => t.id === topicId);
    t.done = !t.done;
    setSubjects(subjects);
    renderAll();
  }

  function deleteTopic(subjectId, topicId){
    const subjects = getSubjects();
    const s = subjects.find(s => s.id === subjectId);
    s.topics = s.topics.filter(t => t.id !== topicId);
    setSubjects(subjects);
    renderAll();
  }

  function renderTodayStrip(subjects){
    const strip = document.getElementById('today-strip');
    strip.innerHTML = '';
    if(subjects.length === 0){
      strip.innerHTML = '<div class="empty-ticket">Add a subject with an exam date to see your countdown here.</div>';
      return;
    }
    const sorted = [...subjects].sort((a,b) => daysUntil(a.examDate) - daysUntil(b.examDate));
    sorted.forEach(s => {
      const d = daysUntil(s.examDate);
      const el = document.createElement('div');
      el.className = 'ticket' + (d <= 3 ? ' urgent' : '');
      el.innerHTML = `
        <div class="days">${d >= 0 ? d : 'Done'}</div>
        <div class="lbl">${d >= 0 ? (d===1?'day left':'days left') : 'exam passed'}</div>
        <div class="sub">${s.name}</div>`;
      strip.appendChild(el);
    });
  }

  function renderFocus(subjects){
    const list = document.getElementById('focus-list');
    const hint = document.getElementById('focus-hint');
    list.innerHTML = '';
    const active = subjects.filter(s => daysUntil(s.examDate) >= 0 && s.topics.some(t => !t.done));
    if(active.length === 0){
      list.innerHTML = '<div class="empty-state">Nothing pending — add subjects and topics to build today\'s plan.</div>';
      hint.textContent = '';
      return;
    }
    let totalTargets = 0;
    active.forEach(s => {
      const pending = s.topics.filter(t => !t.done);
      const daysLeft = Math.max(daysUntil(s.examDate), 1);
      const perDay = Math.max(Math.ceil(pending.length / daysLeft), 1);
      const todaysTopics = pending.slice(0, perDay);
      totalTargets += todaysTopics.length;
      todaysTopics.forEach(t => {
        const row = document.createElement('div');
        row.className = 'focus-item';
        row.innerHTML = `<span class="dot"></span><span>${t.name} <span style="color:var(--ink-soft); font-size:12px;">— ${s.name}</span></span><b>${perDay}/day pace</b>`;
        list.appendChild(row);
      });
    });
    hint.textContent = totalTargets + ' topic' + (totalTargets===1?'':'s') + ' suggested today';
  }

  function renderSubjects(subjects){
    const container = document.getElementById('subjects-container');
    container.innerHTML = '';
    if(subjects.length === 0){
      container.innerHTML = '<div class="empty-state">No subjects yet. Add one above to start tracking your syllabus.</div>';
      return;
    }
    subjects.forEach(s => {
      const total = s.topics.length;
      const doneCount = s.topics.filter(t => t.done).length;
      const pct = total ? Math.round((doneCount/total)*100) : 0;
      const d = daysUntil(s.examDate);

      const card = document.createElement('div');
      card.className = 'subject-card';
      card.innerHTML = `
        <div class="subject-top">
          <h3>${s.name}</h3>
          <span class="exam-date">Exam: ${s.examDate}</span>
          <span class="days-left ${d<=3?'urgent':''}">${d>=0 ? d+' days left' : 'Exam passed'}</span>
        </div>
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div style="font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--ink-soft); margin-bottom:14px;">${doneCount}/${total} topics complete (${pct}%)</div>
        <div class="topic-add">
          <input type="text" placeholder="Add a topic..." id="topic-input-${s.id}">
          <button class="btn small" onclick="addTopic('${s.id}', document.getElementById('topic-input-${s.id}'))">Add</button>
        </div>
        <div class="topic-list" id="topics-${s.id}"></div>
        <div class="subject-actions">
          <button class="btn ghost small" onclick="deleteSubject('${s.id}')">Delete subject</button>
        </div>
      `;
      container.appendChild(card);

      const topicList = card.querySelector(`#topics-${s.id}`);
      if(total === 0){
        topicList.innerHTML = '<div class="no-topics">No topics added yet.</div>';
      } else {
        s.topics.forEach(t => {
          const row = document.createElement('div');
          row.className = 'topic-row' + (t.done ? ' done' : '');
          row.innerHTML = `
            <input type="checkbox" ${t.done?'checked':''} onchange="toggleTopic('${s.id}','${t.id}')">
            <span class="t-name">${t.name}</span>
            <button class="del-x" onclick="deleteTopic('${s.id}','${t.id}')">✕</button>`;
          topicList.appendChild(row);
        });
      }
    });
  }

  function renderAll(){
    const subjects = getSubjects();
    renderTodayStrip(subjects);
    renderFocus(subjects);
    renderSubjects(subjects);
  }

  renderAll();
</script>

</body>
</html>
